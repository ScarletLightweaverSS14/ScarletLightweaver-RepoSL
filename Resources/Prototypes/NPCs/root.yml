# Specific Root compound tasks being used for NPCs.

# Tries to shoot a target in LOS in range.
- type: htnCompound
  id: TurretCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
        
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              # TODO: Non-scuffed
              rangeKey: RangedRange
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: RangedRange
          operator: !type:GunOperator
            targetKey: Target
            requireLOS: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

    - tasks:
        - !type:HTNCompoundTask
          task: IdleSpinCompound
          
- type: htnCompound
  id: EnergyTurretCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyGunTargets
        
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              # TODO: Non-scuffed
              rangeKey: RangedRange
            - !type:TargetInLOSPrecondition
              targetKey: Target
              rangeKey: RangedRange
              opaqueKey: true
          operator: !type:GunOperator
            targetKey: Target
            opaqueKey: true
          services:
            - !type:UtilityService
              id: RangedService
              proto: NearbyGunTargets
              key: Target

    - tasks:
        - !type:HTNCompoundTask
          task: IdleSpinCompound

- type: htnCompound
  id: SimpleRangedHostileCompound
  branches:
    # Priority 1: Flee when critically injured
    - tasks:
        - !type:HTNCompoundTask
          task: FleeWhenCriticalCompound
    # Priority 2: Flee when injured
    - tasks:
        - !type:HTNCompoundTask
          task: FleeWhenInjuredCompound
    # Priority 3: Ranged combat
    - tasks:
        - !type:HTNCompoundTask
          task: InnateRangedCombatCompound
    # Priority 4: Melee combat
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    # Priority 5: Idle
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound

- type: htnCompound
  id: SimpleHumanoidHostileCompound
  branches:
    # Priority 1: Ranged combat
    - tasks:
        - !type:HTNCompoundTask
          task: RangedCombatCompound
    # Priority 2: Melee combat
    - tasks:
        - !type:HTNCompoundTask
          task: MeleeCombatCompound
    # Priority 3: Idle
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
