# Stage two: a winding arena, two tower choices, and three equipment tiers each.
- type: towerDefenseArena
  id: TowerDefenseFirstWave
  width: 13
  height: 9
  route: ["0,7", "10,7", "10,4", "3,4", "3,1", "12,1"]
  startingCash: 400
  baseHealth: 5
  towers:
  - TowerDefenseTider
  - TowerDefenseSecurity
  buildFloor: FloorAstroGrass
  roadFloor: FloorAsphalt
  deckFloor: FloorGrayConcreteSmooth
  waves:
  - spawnDelay: 2
    enemies:
    - prototype: TowerDefenseCarp
      count: 5

- type: towerDefenseTower
  id: TowerDefenseTider
  name: td-tower-tider
  symbol: T
  entity: TowerDefenseTider
  gear: TowerDefenseTiderGear
  cost: 50
  levels:
  - name: td-weapon-bat
    weapon: BaseBallBat
    damage: 10
    cooldown: 1
    range: 1.6
  - name: td-weapon-toolbox
    weapon: WeaponMeleeToolboxRobust
    upgradeCost: 75
    damage: 20
    cooldown: 0.8
    range: 1.7
  - name: td-weapon-tidebreaker
    weapon: ClaymoreForged
    upgradeCost: 125
    damage: 40
    cooldown: 0.65
    range: 2

- type: towerDefenseTower
  id: TowerDefenseSecurity
  name: td-tower-security
  symbol: S
  entity: TowerDefenseSecurity
  gear: TowerDefenseSecurityGear
  cost: 100
  levels:
  - name: td-weapon-pistol
    weapon: WeaponPistolMk58
    shotVisuals: BulletPistolTraceSP
    damage: 8
    cooldown: 0.8
    range: 4
  - name: td-weapon-improved-pistol
    weapon: WeaponPistolMk58
    shotVisuals: BulletPistolTraceFMJ
    upgradeCost: 125
    damage: 16
    cooldown: 0.7
    range: 4.5
  - name: td-weapon-lecter
    weapon: WeaponRifleLecter
    shotVisuals: BulletRifleTraceSP
    upgradeCost: 200
    damage: 24
    cooldown: 0.45
    range: 5

- type: startingGear
  id: TowerDefenseTiderGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack

- type: startingGear
  id: TowerDefenseSecurityGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSec
    shoes: ClothingShoesBootsCombat
    outerClothing: ClothingOuterArmorBasic
    head: ClothingHeadHelmetBasic

- type: entity
  id: TowerDefenseConsole
  name: tower defense console
  description: Defend the station from a very predictable carp invasion. Place and upgrade Tider and Security towers along the road.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/arcade.rsi
    layers:
    - state: arcade
    - state: screen_invaders
      shader: unshaded
  - type: Clickable
  - type: InteractionOutline
  - type: TowerDefenseArena
  - type: ActivatableUI
    key: enum.TowerDefenseUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.TowerDefenseUiKey.Key:
        type: TowerDefenseBoundUserInterface
        interactionRange: 20

- type: entity
  id: TowerDefenseCarp
  name: invading space carp
  description: It has memorized exactly one road.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Carps/space.rsi
    state: alive
    drawdepth: Mobs
  - type: TowerDefenseEnemy
    maxHealth: 30
    speed: 1
    reward: 10
    baseDamage: 1

- type: entity
  parent: AppearanceHuman
  id: TowerDefenseTider
  name: Tider tower
  description: Urist McHands has found a bat and a purpose.
  components:
  - type: TowerDefenseTower

- type: entity
  parent: AppearanceHuman
  id: TowerDefenseSecurity
  name: Security tower
  description: Urist McHands has reported for stationary duty.
  components:
  - type: TowerDefenseTower

- type: entity
  id: TowerDefenseSpawnMarker
  name: invasion entrance
  description: Invaders arrive here and follow the asphalt road.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Effects/portal.rsi
    state: portal-red
    drawdepth: FloorTiles
    shader: unshaded
    noRot: true

- type: entity
  id: TowerDefenseBaseMarker
  name: station defense gate
  description: Keep invaders from reaching this blue gate to protect the station.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Effects/portal.rsi
    state: portal-blue
    drawdepth: FloorTiles
    shader: unshaded
    noRot: true

# Full campaign; keep TowerDefenseFirstWave as the short equipment/debug encounter.
- type: towerDefenseArena
  id: TowerDefenseCampaign
  width: 13
  height: 9
  route: ["0,7", "10,7", "10,4", "3,4", "3,1", "12,1"]
  startingCash: 200
  baseHealth: 5
  waveBreak: 8
  towers:
  - TowerDefenseTider
  - TowerDefenseSecurity
  buildFloor: FloorAstroGrass
  roadFloor: FloorAsphalt
  deckFloor: FloorGrayConcreteSmooth
  waves:
  - spawnDelay: 2
    enemies:
    - prototype: TowerDefenseCarp
      count: 5
  - spawnDelay: 1.8
    enemies:
    - prototype: TowerDefenseCarp
      count: 8
  - spawnDelay: 1.6
    enemies:
    - prototype: TowerDefenseCarp
      count: 10
    - prototype: TowerDefenseSharkminnow
      count: 2
  - spawnDelay: 1.4
    enemies:
    - prototype: TowerDefenseCarp
      count: 8
    - prototype: TowerDefenseSharkminnow
      count: 5
  - spawnDelay: 1.2
    enemies:
    - prototype: TowerDefenseCarp
      count: 12
    - prototype: TowerDefenseSharkminnow
      count: 8
  - spawnDelay: 1.5
    enemies:
    - prototype: TowerDefenseSharkminnow
      count: 5
    - prototype: TowerDefenseDragon
      count: 1

- type: entity
  id: TowerDefenseSharkminnow
  name: invading sharkminnow
  description: Bigger teeth, faster service, same inflexible route.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Carps/sharkminnow.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: alive
    - state: mouth
      shader: unshaded
  - type: TowerDefenseEnemy
    maxHealth: 90
    speed: 1.3
    reward: 25
    baseDamage: 2

- type: entity
  id: TowerDefenseDragon
  name: space dragon boss
  description: The invasion manager has arrived to discuss your performance.
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Carps/dragon.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: alive
    - state: alive-unshaded
      shader: unshaded
  - type: TowerDefenseEnemy
    maxHealth: 1000
    boss: true
    speed: 0.65
    reward: 150
    baseDamage: 5
