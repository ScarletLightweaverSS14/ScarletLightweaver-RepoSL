# ============================================================
# Tiered expedition comrades — each tier shares the same HTN
# and callouts as the base comrade but with scaled HP and a
# loot bag in their back slot.
# ============================================================

# --- Base tier entities (parents for weapon variants) ---

# Challenging (expedition budget ~75)
- type: entity
  suffix: Challenging
  parent: MobSovietComrade
  id: MobSovietComradeChallenging
  categories: [ Spawner ]

# Difficult (expedition budget ~225) — visibly tougher
- type: entity
  suffix: Difficult
  parent: MobSovietComrade
  id: MobSovietComradeDifficult
  categories: [ Spawner ]
  components:
    - type: MobThresholds
      thresholds:
        0: Alive
        130: Critical
        260: Dead
    - type: Stamina
