# ============================================================
# Red Vanguard — elite USSP soldiers, max tier (Impossible+).
# Wear marine hardsuits; significantly more HP than comrades.
# ============================================================
- type: entity
  name: Red Vanguard
  parent: MobSovietComrade
  id: MobUSSPRedVanguardBase
  categories: [ Spawner ]
  components:
    - type: MobThresholds
      thresholds:
        0: Alive
        220: Critical
        380: Dead
    - type: Stamina
      baseCritThreshold: 220
    - type: NpcCallout
      spotPhrases:
        - "For the Red Vanguard!"
        - "Advance! The Motherland calls!"
        - "No mercy for the enemy of the Union!"
        - "The Vanguard does not retreat!"
        - "Target acquired — open fire!"
      hurtPhrases:
        - "AGGHH!"
        - "Still standing, comrade!"
        - "Just a scratch!"
        - "The Union gave me this pain!"
      critPhrases:
        - "The Vanguard... does not fail..."
        - "They will know... the Union's wrath..."
        - "Tell the Admiral... I held the line..."
        - "For... the Red Vanguard..."
        - "The Motherland... expected more of me..."

- type: entity
  suffix: Ak
  parent: MobUSSPRedVanguardBase
  id: MobUSSPRedVanguardAk
  components:
    - type: Loadout
      prototypes:
        - RedVanguardGearAk

- type: entity
  suffix: Knife
  parent: MobUSSPRedVanguardBase
  id: MobUSSPRedVanguardKnife
  components:
    - type: Loadout
      prototypes:
        - RedVanguardGearKnife

# Three playable classes for dynamic encounters
- type: entity
  suffix: Ranged
  parent: MobUSSPRedVanguardBase
  id: MobUSSPRedVanguardRanged
  components:
    - type: HTN
      rootTask:
        task: VanguardRangedHostileCompound
    - type: Loadout
      prototypes:
        - RedVanguardGearRanged

- type: entity
  suffix: Melee
  parent: MobUSSPRedVanguardBase
  id: MobUSSPRedVanguardMelee
  components:
    - type: Loadout
      prototypes:
        - RedVanguardGearMelee

- type: entity
  suffix: Hybrid
  parent: MobUSSPRedVanguardBase
  id: MobUSSPRedVanguardHybrid
  components:
    - type: HTN
      rootTask:
        task: SovietVanguardHybridHostileCompound
    - type: Loadout
      prototypes:
        - RedVanguardGearHybrid

# Spawner — randomly picks one of the three classes
- type: entity
  id: MobUSSPRedVanguardSpawner
  name: Red Vanguard spawner
  parent: MarkerBase
  categories: [ Spawner ]
  components:
    - type: Sprite
      layers:
        - state: red
    - type: RandomSpawner
      prototypes:
        - MobUSSPRedVanguardRanged
        - MobUSSPRedVanguardMelee
        - MobUSSPRedVanguardHybrid
      offset: 0.1

#boss
- type: entity
  name: soviet bear
  id: MobBearSoviet
  parent: SimpleSpaceMobBase
  description: Smells like booze.
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - DungeonSoviet
  - type: Sprite
    drawdepth: Mobs
    sprite: _Starlight/Mobs/Animals/bear.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: bear
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.40
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bear
      Critical:
        Base: bear_dead
      Dead:
        Base: bear_dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      300: Dead
  - type: Stamina
    baseCritThreshold: 250
  - type: MovementAlwaysTouching
  - type: Bloodstream
    bloodReferenceSolution:
        reagents:
        - ReagentId: Vodka
          Quantity: 300
  - type: CombatMode
  - type: TemperatureDamage
    heatDamageThreshold: 500
    coldDamageThreshold: 0
  - type: MeleeWeapon
    soundHit:
        path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 10
        Slash: 20
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Puller
    needsHands: false
  - type: Speech
    speechVerb: LargeMob
  - type: Vocal
    sounds:
      Unsexed: Bear
  - type: InteractionPopup
    successChance: 0.25
    interactSuccessString: petting-success-bear
    interactFailureString: petting-failure-bear
    interactSuccessSound:
      path: /Audio/Animals/sloth_squeak.ogg
  - type: ReplacementAccent
    accent: genericAggressive
  - type: Butcherable
    spawned:
    - id: FoodMeatBear
      amount: 6
    - id: ChemistryBottleOmnizine
      amount: 1
