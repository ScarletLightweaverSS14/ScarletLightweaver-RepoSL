# Phase 1 Military Raid expedition mobs.
# All mobs reuse the existing SimpleHumanoidHostileCompound AI (custom per-role HTNs
# are a later phase). Distinction comes from gear, armor and role loadouts.

#region SSF marine armor
# Elite plate: ~50% resistance to most damage, intentionally weaker vs Heat (~35%)
# to provide counterplay, per the design doc. Reuses the bulletproof vest sprite.
- type: entity
  parent: ClothingOuterArmorBulletproof
  id: ClothingOuterArmorSSFMarine
  name: SSF marine plate
  suffix: SSF, Do Not Map
  description: Heavy composite plate issued to Space Force Marines. Excellent all-round protection, but its ablative layer copes poorly with sustained heat.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.65
        Cold: 0.5
        Shock: 0.5
        Caustic: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.6
#endregion

#region base comrade
- type: entity
  name: comrade
  parent: BaseMobHuman
  id: MobMilitaryComrade
  categories: [ Spawner ]
  components:
    - type: Prying
      pryPowered: true
      force: true
      speedModifier: 1.5
    - type: NpcFactionMember
      factions:
        - Military
    - type: Loadout
      prototypes:
        - MilitaryGearRifle
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound
      blackboard:
        NavInteract: !type:Bool
          true
#endregion

