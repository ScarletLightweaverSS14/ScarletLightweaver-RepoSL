- type: entity
  name: syndicate
  parent: MobSyndicateFootsoldier
  id: MobSyndicateBase
  components:
    - type: Prying
      pryPowered: true
      force: true
      speedModifier: 5.5
      useSound:
        path: /Audio/Items/crowbar.ogg
      useSoundOnDoafter: /Audio/_Starlight/Machines/airlock_pry.ogg #SL
      playSoundOnDoafter: true
    - type: RandomNameList
      datasetId: NamesSyndicate
      prefix: Footsoldier
    - type: NpcFactionMember
      factions:
        - DungeonSyndicate
    - type: Loadout
      prototypes:
        - SyndicateFootsoldierGearRuin
    - type: InputMover
    - type: MobMover
    - type: NpcLootBreakOnDeath
      chance: 0.85
    - type: NpcCallout
      spotPhrases:
        - "Contact! Over here!"
        - "I see them! Engage!"
        - "Target spotted!"
        - "Move up! They're here!"
        - "Engaging target!"
      hurtPhrases:
        - "AUGH!"
        - "Taking fire!"
        - "Hit! Still up!"
        - "Damn it!"
        - "Son of a—!"
      critPhrases:
        - "AAAGGH!"
        - "I'm down!"
        - "Stupid Nanotrasen!"
        - "They got me!"
        - "AHHHH!"
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound
      blackboard:
        NavInteract: !type:Bool
          true
        NavPry: !type:Bool
          true
