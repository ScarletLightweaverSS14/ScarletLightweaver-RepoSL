#heavy
- type: entity
  name: syndicate enforcer
  suffix: Heavy, Base
  parent: MobSyndicateBase
  id: MobSyndicateHeavy
  abstract: true
  description: A heavily armored syndicate enforcer. Designed to absorb punishment while the rest of the team pushes forward. Do not engage alone.
  components:
    - type: RandomNameList
      datasetId: NamesSyndicate
      prefix: Enforcer
    - type: MobThresholds
      thresholds:
        0: Alive
        250: Critical
        350: Dead
    - type: Stamina
      critThreshold: 300
    - type: NpcLootBreakOnDeath
      chance: 0.85
    - type: HTN
      rootTask:
        task: SyndicateHeavyHostileCompound
      blackboard:
        NavInteract: !type:Bool
          true
        NavPry: !type:Bool
          true
