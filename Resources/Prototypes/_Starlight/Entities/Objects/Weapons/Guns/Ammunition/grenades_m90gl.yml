    suffix: false

# Teargas — crowd control round
- type: entity
  id: GrenadeM90GLTeargas
  name: 20mm teargas grenade
  description: A small 20mm teargas canister for the M90 GL underbarrel launcher. Releases a cloud of irritating tear gas on impact.
  parent: [ BaseGrenadeM90GL, BaseSecurityContraband ]
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeM90GLTeargas
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: flash  # Placeholder; replace with dedicated 20mm teargas sprite when available
