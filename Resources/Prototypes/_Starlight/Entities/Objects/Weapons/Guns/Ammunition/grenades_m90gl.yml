# M90 GL Underbarrel Grenade Launcher — 20mm grenade rounds
# Single-shot cartridges for the M90 GL's underbarrel launcher.
# Loaded directly into the ballistic ammo slot; fits only the M90 GL.

- type: entity
  abstract: true
  id: BaseGrenadeM90GL
  name: base 20mm grenade round
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - GrenadeM90GL
  - type: Item
    size: Small
  - type: Sprite

# Baton — less-lethal stamina round
- type: entity
  id: GrenadeM90GLBaton
  name: 20mm baton grenade
  description: A small 20mm less-lethal baton grenade for the M90 GL underbarrel launcher. Delivers a punishing stamina blast on impact.
  parent: [ BaseGrenadeM90GL, BaseSecurityContraband ]
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeM90GLBaton
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: baton
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: baton
    suffix: false

# Blast — concussive explosive round
- type: entity
  id: GrenadeM90GLBlast
  name: 20mm blast grenade
  description: A small 20mm blast grenade for the M90 GL underbarrel launcher. Produces a moderate concussive explosion on impact.
  parent: [ BaseGrenadeM90GL, BaseSyndicateContraband ]
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeM90GLBlast
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: blast
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false

# Frag — fragmentation round
- type: entity
  id: GrenadeM90GLFrag
  name: 20mm frag grenade
  description: A small 20mm fragmentation grenade for the M90 GL underbarrel launcher. Small blast with a shower of sub-lethal pellets.
  parent: [ BaseGrenadeM90GL, BaseSyndicateContraband ]
  components:
  - type: CartridgeAmmo
