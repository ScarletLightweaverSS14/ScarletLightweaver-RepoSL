  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

# Flashbang — disorientation round
- type: entity
  id: GrenadeM90GLFlash
  name: 20mm flashbang
  description: A small 20mm flashbang for the M90 GL underbarrel launcher. Blinds targets in a moderate radius on impact.
  parent: [ BaseGrenadeM90GL, BaseSecurityContraband ]
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeM90GLFlash
  - type: Sprite
