- type: entity
  name: M90 GL
  parent: [BaseWeaponRifle, BaseSyndicateContraband]
  id: WeaponRifleM90GrenadeLauncher
  description: "An older bullpup carbine model with a single-shot underbarrel grenade launcher.\nFeeds from .20 rifle magazines and individually loaded 40mm grenades."
  components:
  - type: AltWeaponry
    gunPrototype: WeaponM90Underbarrel
    container: underbarrel_gun
    ammoContainer: grenade_chamber
    ammoSlot:
      name: underbarrel-launcher-slot
      priority: 3
      swap: false
      insertOnInteract: true
      whitelist:
        tags:
        - Grenade40mm
      insertSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      ejectSound: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/carbine.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/carbine.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot ""
      gun_chamber: !type:ContainerSlot ""
      firing_pin: !type:Container # starlight
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  id: WeaponM90Underbarrel
  name: M90 underbarrel grenade launcher
  categories: [ HideSpawnMenu ]
  components:
  - type: Gun
    fireRate: 1
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/grenade_launcher.ogg
  - type: ContainerAmmoProvider
    container: grenade_chamber

