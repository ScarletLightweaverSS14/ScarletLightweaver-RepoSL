# --- CHARYBDIS 280mm ---

# M381 CHARYBDIS 280mm 26.5kg Slug
- type: entity
  id: BulletCharon280mmSlug
  name: M381 CHARYBDIS 280mm slug
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Artillery Ammo/charon_ammo.rsi
    layers:
      - state: railgun_slug
    scale: 2, 2
  - type: Projectile
    damage:
      types:
        Piercing: 750       # was 500 - penetrates ALOT more per request
        Blunt: 200          # was 150
        Structural: 1000    # was 600 - punches through layers
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 550     # was 350 - better secondary explosion
    intensitySlope: 10
    maxIntensity: 42        # was 28
    canCreateVacuum: true
  - type: PointLight
    enabled: true
    radius: 5
    energy: 4
    color: "#ff6600"
  - type: RadarBlip
    color: "#FF6600"
    scale: 1.5
    shape: Triangle
    requireInSpace: true

# M381 CHARYBDIS 280mm 40kg Subnuclear Slug
- type: entity
  id: BulletCharon280mmSubnuclear
