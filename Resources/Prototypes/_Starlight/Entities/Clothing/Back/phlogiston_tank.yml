# Phlogiston backpack tanks for use with the spray nozzle (WeaponSprayNozzle).
# Fill with Phlogiston or PhlogNapalmMix respectively, then equip and
# hold a spray nozzle to shoot actual flame projectiles.

- type: entity
  parent: [Clothing, ClothingSlotBase]
  id: ClothingBackpackPhlogistonTank
  name: phlogiston backpack tank
  description: A reinforced backpack tank rated for highly flammable reagents. When connected to a spray nozzle, it launches jets of phlogiston flame at near-plasma temperatures. Fill with Phlogiston.
  components:
  - type: Tag
    tags:
    - NozzleBackTank
    - WhitelistChameleon
  - type: Sprite
    sprite: Clothing/Back/Backpacks/waterbackpack.rsi
    state: icon
    color: "#D4872A"  # phlogiston orange tint
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: BACK
    sprite: Clothing/Back/Backpacks/waterbackpack.rsi
  - type: ItemSlots
    slots:
      item:
        priority: 2
        whitelist:
          tags:
          - SprayNozzle
  - type: ItemMapper
    mapLayers:
      icon-filled:
        whitelist:
          tags:
            - SprayNozzle
  - type: Appearance
  - type: SolutionAmmoProvider
    solutionId: tank
    proto: BulletWaterShot
    fireCost: 5
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 500
  - type: SolutionTransfer
    transferAmount: 50
    maxTransferAmount: 100
    minTransferAmount: 10
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: DrawableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
    exactVolume: true

