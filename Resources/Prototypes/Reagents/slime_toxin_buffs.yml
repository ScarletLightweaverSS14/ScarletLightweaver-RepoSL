# Slime Toxin Healing Effects
# This file configures which toxin reagents provide healing to slime people.
# 
# Requirements:
# - Requires 10+ total units across all toxins to activate healing
# - Uses the highest-quantity toxin to determine healing effectiveness:
#   * High-end toxins (3+ damage/unit): Weaker omnizine-like healing (all damage types), 1.5x multiplier
#   * Medium toxins (2 damage/unit): Heal brute, burn, and caustic damage, 1.25x multiplier
#   * Low-end toxins (under 2 damage/unit): Heal brute damage only, 1.0x multiplier
# - Only includes reagents with Poison or Radiation damage (Asphyxiation damage is excluded)

# HIGH-END TOXINS (3+ damage per unit - strong omnizine-like healing)

- type: reagent
  id: Toxin
  parent: Toxin
  metabolisms:
    Poison:
      effects:
      - !type:SlimeToxinHealing
        toxinDamage:
          types:
            Poison: 4

