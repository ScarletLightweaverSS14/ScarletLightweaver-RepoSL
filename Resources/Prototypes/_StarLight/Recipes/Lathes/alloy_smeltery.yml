# Starlight: Alloy Smeltery lathe recipes.
# All outputs from the smeltery come out HOT (AlloySmelteryOutput component adds DamageOnHolding).
# Materials required are finished sheets/ingots, not raw ores.
# Recipes intentionally use material IDs matching the MaterialPrototype definitions.

## ============================
## PLASTITIUM
## Steel + Plasma + Gold traces
## 1 sheet requires: 1 plasteel-worth + 1 gold ingot per sheet
## ============================

- type: latheRecipe
  id: SheetPlastitium1
  result: SheetPlastitium1
  completetime: 8
  materials:
    Plasteel: 100
    Steel: 100
    Gold: 50

