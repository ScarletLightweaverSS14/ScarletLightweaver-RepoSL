# Soviet Comrade NPC AI
# Priority order: heal → equip backup melee → reload → flee → ranged → melee → idle

- type: htnCompound
  id: SovietComradeHostileCompound
  branches:
    # 1. Heal when critically wounded — use medipen from pocket (visually moves to hand first)
    - preconditions:
        - !type:LowHealthPrecondition
          minDamagePercent: 0.55
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UseItemFromPocketOperator
            itemTag: Medipen

    # 2. Draw backup melee from pocket when gun is empty (e.g. shotgunner pulls a knife)
    - preconditions:
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:EquipFromPocketOperator
            itemTag: Knife

    # 3. Reload gun from pocket when empty
    - preconditions:
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ReloadFromPocketOperator

    # 3b. Gun break — fully out of ammo after at least one reload, no spare mags left
    - preconditions:
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
        - !type:KeyExistsPrecondition
          key: _GunHasBeenReloaded
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:GunBreakOperator

    # 4. Kite: flee AND shoot simultaneously when critically wounded and unable to heal/reload.
    #    GunAmmoPrecondition (no params) fails for melee-only NPCs (no gun found), so they skip this.
    - preconditions:
        - !type:LowHealthPrecondition
          minDamagePercent: 0.55
        - !type:KeyExistsPrecondition
          key: TargetCoordinates
        - !type:GunAmmoPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:FleeCombatOperator
            targetKey: TargetCoordinates
            gunTargetKey: Target
            range: 9.0

    # 5. Ranged combat when armed with ammo
    #    (uses GunCombatCompound directly to avoid RangedCombatCompound's gun-drop branch)
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    # 6. Fallback melee combat — switch to melee hand first, then attack
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:SwitchHandToMeleeOperator
        - !type:HTNCompoundTask
          task: MeleeCombatCompound

    # 7. Idle
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
