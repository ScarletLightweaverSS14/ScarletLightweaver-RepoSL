# ========================================================
# USSP RED VANGUARD GEAR (Impossible+ tier elite soldiers)
# Full marine hardsuit, always-functional AK (no break chance),
# grenade belt. Not unremovable - reward for killing them.
# ========================================================
- type: startingGear
  id: USSPRedVanguardGearBelt
  equipment:
    head: ClothingHeadHatUshanka
    jumpsuit: ClothingUniformJumpsuitSovietFatigues
    outerClothing: ClothingOuterHardsuitSovietMarineUnremovable
    shoes: ClothingShoesSovietCombatBoots
    back: ClothingBackpackDuffelRedVanguardLoot
    id: SovietIdCard
    ears: ClothingHeadsetAltSoviet
    belt: ClothingBeltSovietMarineWebbingLoadout
    gloves: ClothingHandsMercGlovesCombat
    pocket1: GrenadeShrapnel
    pocket2: GrenadeIncendiary

- type: startingGear
  id: USSPRedVanguardGearAk
  parent: USSPRedVanguardGearBelt
  inhand:
  - WeaponRifleAk

- type: startingGear
  id: USSPRedVanguardGearKnife
  parent: USSPRedVanguardGearBelt
  inhand:
  - Finka
