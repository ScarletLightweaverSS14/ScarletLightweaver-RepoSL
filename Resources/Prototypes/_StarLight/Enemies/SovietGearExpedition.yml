# Soviet expedition gear loadouts, tiered by difficulty.
# All tiers use Unremovable armor and the NoSlip/Unremovable boots.

# ========================================================
# BASE GEAR (shared across tiers - boots + ushanka + id)
# ========================================================
- type: startingGear
  id: SovietComradeGearExpeditionBase
  equipment:
    head: ClothingHeadHatUshanka
    jumpsuit: ClothingUniformJumpsuitSoviet
    shoes: ClothingShoesSovietCombatBoots
    id: SovietIdCard

# ========================================================
# CHALLENGING TIER - padded vest, utility belt
# ========================================================
- type: startingGear
  id: SovietComradeGearChallengingBelt
  equipment:
    belt: ClothingSovietBelt
    outerClothing: ClothingOuterArmorSovietPaddedUnremovable
    back: ClothingBackpackDuffelSovietComradeChallengingLoot
  storage:
    belt:
    - RadioHandheld
    - GeigerCounter
    - Flare
    - Flare
    - Flare

- type: startingGear
  id: SovietComradeGearChallengingBrokenBottle
  parent: [SovietComradeGearExpeditionBase, SovietComradeGearChallengingBelt]
  inhand:
  - BrokenBottle

- type: startingGear
  id: SovietComradeGearChallengingFinka
  parent: [SovietComradeGearExpeditionBase, SovietComradeGearChallengingBelt]
  inhand:
  - Finka

- type: startingGear
  id: SovietComradeGearChallengingSawn
  parent: SovietComradeGearExpeditionBase
  equipment:
    belt: ClothingSovietBandolier
    outerClothing: ClothingOuterArmorSovietPaddedUnremovable
    back: ClothingBackpackDuffelSovietComradeChallengingLoot
  inhand:
  - WeaponShotgunSawnSoviet

- type: startingGear
  id: SovietComradeGearChallengingMakarov
  parent: [SovietComradeGearExpeditionBase, SovietComradeGearChallengingBelt]
  inhand:
  - WeaponPistolMakarovSoviet

