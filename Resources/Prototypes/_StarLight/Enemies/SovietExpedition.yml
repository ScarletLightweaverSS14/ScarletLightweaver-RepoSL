# ========================================================
# USSP RED VANGUARD (Impossible tier elite enemies)
# Full marine hardsuit — reward for defeating them.
# ========================================================
- type: entity
  name: Red Vanguard soldier
  description: An elite USSP soldier in a sealed marine hardsuit. They move with practiced efficiency — not conscripts, but veterans of something far worse than a standard salvage expedition.
  suffix: Red Vanguard, AK
  parent: MobSovietComrade
  id: MobUSSPRedVanguardAk
  components:
  - type: Loadout
    prototypes:
    - USSPRedVanguardGearAk

- type: entity
  name: Red Vanguard operator
  description: A Red Vanguard close-quarters specialist. The knife on their belt has seen use. Their hardsuit has seen more.
  suffix: Red Vanguard, Knife
  parent: MobSovietComrade
  id: MobUSSPRedVanguardKnife
  components:
  - type: Loadout
    prototypes:
    - USSPRedVanguardGearKnife
