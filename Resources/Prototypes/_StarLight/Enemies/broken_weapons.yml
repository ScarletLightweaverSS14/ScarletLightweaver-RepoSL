# Broken/non-functional weapon variants for NPC loot.
# NpcLootBreakOnDeathSystem automatically spawns these (by appending "Broken" to the prototype ID).
# Each variant removes Gun/MeleeWeapon via deleted: true so they cannot be fired or used as weapons.
# All broken variants include a PhysicalComposition so they can be fed into a material reclaimer.

# ── Soviet comrade weapons ──────────────────────────────────────────────────

- type: entity
  parent: WeaponPistolMakarov
  id: WeaponPistolMakarovBroken
  suffix: Broken
  name: broken Makarov pistol
  description: A Soviet surplus Makarov, damaged beyond repair. The slide is cracked and the barrel bent.
  components:
  - type: Gun
    deleted: true
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
      Plastic: 50

- type: entity
  parent: WeaponRifleAk
  id: WeaponRifleAkBroken
  suffix: Broken
  name: broken AK rifle
  description: An AK-pattern rifle reduced to scrap. The receiver is shattered and the barrel warped.
  components:
  - type: Gun
    deleted: true
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
      Wood: 100

- type: entity
  parent: WeaponShotgunSawn
  id: WeaponShotgunSawnBroken
  suffix: Broken
  name: broken sawn-off shotgun
  description: A sawn-off shotgun with a snapped stock and cracked breech — completely inoperable.
  components:
  - type: Gun
    deleted: true
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Wood: 150

