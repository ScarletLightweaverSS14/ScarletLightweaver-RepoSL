- type: startingGear
  id: SovietComradeGear
  equipment:
    head: ClothingHeadHatUshanka
    jumpsuit: ClothingUniformJumpsuitSoviet
    shoes: ClothingShoesBootsNpcSoviet
    id: SovietIdCard
    outerClothing: ClothingOuterSovietGreatcoatNPC
#utility (non-shotgunner) belt
- type: startingGear
  id: SovietComradeGearBelt
  equipment:
    belt: ClothingSovietBelt
  storage:
    belt:
    - RadioHandheld
    - GeigerCounter
    - Flare
    - Flare
    - Flare
    - Flare
#melee
- type: startingGear
  id: SovietComradeGearBrokenBottle
  parent: [SovietComradeGear, SovietComradeGearBelt]
  equipment:
    pocket1: BruteAutoInjector
  inhand:
  - BrokenBottle
- type: startingGear
  id: SovietComradeGearFinka
  parent: SovietComradeGear
  equipment:
    pocket1: BruteAutoInjector
  inhand:
  - Finka
#shotgun
- type: startingGear
  id: SovietComradeGearSawn
  parent: SovietComradeGear
  equipment:
    belt: ClothingSovietBandolier
    pocket1: BruteAutoInjector
    pocket2: Finka
  inhand:
  - WeaponShotgunSawn
#pistol
- type: startingGear
  id: SovietComradeGearMakarov
  parent: [SovietComradeGear, SovietComradeGearBelt]
  equipment:
    pocket1: BruteAutoInjector
    pocket2: MagazinePistolSP
  inhand:
  - WeaponPistolMakarov
#rifle
- type: startingGear
  id: SovietComradeGearAk
  parent: [SovietComradeGear, SovietComradeGearBelt]
  equipment:
    pocket1: BruteAutoInjector
    pocket2: MagazineLightRifleSP
  inhand:
  - WeaponRifleAk

