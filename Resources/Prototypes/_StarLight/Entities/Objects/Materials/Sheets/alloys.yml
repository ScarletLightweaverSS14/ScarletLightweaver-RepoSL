# Starlight: Sheet entities for alloy smeltery outputs.
# All alloy sheets use the plasteel RSI (Objects/Materials/Sheets/metal.rsi) with a color tint.
# They come out HOT from the smeltery and deal burn damage until cooled.

## --- Plastitium ---
- type: entity
  parent: SheetPlasteel
  id: SheetPlastitium
  name: plastitium
  description: A shimmering violet alloy sheet. Lightweight and impressively strong — but it just came out of the smelter and is still searing hot.
  suffix: Full
  components:
    - type: Material
    - type: PhysicalComposition
      materialComposition:
        Plastitium: 100
    - type: Stack
      stackType: Plastitium
      baseLayer: base
      layerStates:
        - plasteel
        - plasteel_2
        - plasteel_3
    - type: Sprite
      state: plasteel_3
      color: "#8a4fc7"
      layers:
        - state: plasteel_3
          map: ["base"]
          color: "#8a4fc7"
    - type: HotAlloy
    - type: DamageOnHolding
      enabled: true
      interval: 1
      damage:
        types:
          Heat: 3

- type: entity
  parent: SheetPlastitium
  id: SheetPlastitium10
  name: plastitium
  suffix: 10
  components:
    - type: Sprite
      state: plasteel
      color: "#8a4fc7"
    - type: Stack
      stackType: Plastitium
      count: 10

- type: entity
  parent: SheetPlastitium
  id: SheetPlastitium1
  name: plastitium
  suffix: Single
  components:
    - type: Sprite
      state: plasteel
      color: "#8a4fc7"
    - type: Stack
      stackType: Plastitium
      count: 1

