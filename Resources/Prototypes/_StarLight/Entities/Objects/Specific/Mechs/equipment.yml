- type: entity
  id: MechEquipmentBorgPilot
  parent: [ BaseMechEquipment ]
  name: exosuit AI control beacon
  description: A device used to transmit exosuit data. Also allows active AI units to take control of said exosuit.
  components:
  - type: MechEquipment
    equipmentType: Passive
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Mechs/equipment.rsi
    state: exosuit_beacon
  - type: Item
  - type: MultiHandedItem
  - type: PilotSupportModule
    pilotWhitelist:
      components:
        - BorgChassis
  - type: Tag
    tags:
    - CombatMech
    - IndustrialMech
    - SpecialMech

- type: entity
  id: MechEquipmentSecGrabber
  parent: [ BaseMechEquipment, CombatMechEquipment, BaseSecurityContraband]
  name: Hydraulic Claw
  description: A specialized Hydraulic claw designed for the containment of multiple subjects. Can hold up to 4 items at once.
  components:
  - type: Sprite
    state: paddy_claw
  - type: Item
  - type: MultiHandedItem
  - type: MechGrabber
    maxContents: 4
    grabDelay: 3
    grabEnergyDelta: -10
    CanGrabMobs: true
  - type: UIFragment
    ui: !type:MechGrabberUi
  - type: ContainerContainer
    containers:
      item-container: !type:Container
  - type: ChildBlockVision
  - type: Tag
    tags:
    - PaddyMech


  - type: Retractor
  - type: SurgeryTool
    successRate: 0.5 # they are very much too large
    speed: 1.5
    startSound:
      path: /Audio/Mecha/sound_mecha_hydraulic.ogg

- type: entity
  id: MechEquipmentMedicalCarrier
  parent: [ BaseMechEquipment ]
  name: medical patient carrier
  description: A stasis pod designed for mechs that can hold one patient in stasis. Slows down metabolism and prevents bodily decay. Can only hold other players.
  components:
  - type: MechEquipment
    equipmentType: Active
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Mechs/medical_carrier.rsi
    state: medical_carrier
  - type: Item
  - type: MultiHandedItem
  - type: MechGrabber
    maxContents: 1
    grabDelay: 2
    grabEnergyDelta: -20
    canGrabMobs: true
    canGrabItems: false
    whitelist:
      components:
        - HumanoidAppearance
        - Body
      tags:
        - !Pilot
  - type: StasisBed
  - type: AntiRotOnBuckle
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.001
        Blunt: -0.001
  - type: UIFragment
    ui: !type:MechGrabberUi
  - type: ContainerContainer
    containers:
      item-container: !type:Container
  - type: Tag
    tags:
    - MedicalMechModule
