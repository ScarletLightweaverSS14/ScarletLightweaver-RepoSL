# Soviet supply caches - spawn in expedition dungeons as retrieval objectives.
# Each tier contains tickets and useful materials.
# Bringing these back to the shuttle is the "retrieval objective."

# ================================================
# CHALLENGING TIER CACHE (small reward)
# ================================================
- type: entity
  parent: CrateGenericSteel
  id: CrateSovietSupplyCacheChallenging
  name: soviet supply cache
  description: A sealed steel crate bearing Soviet markings. Contains field rations, spare parts and salvage tickets from the supply depot.
  suffix: Challenging
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SalvageTicket20
        - id: SalvageTicket15
        - id: SalvageTicket10
        - id: SheetSteel
        - id: IngotSilver
          prob: 0.5
        - id: DrinkVodkaBottleFull
        - id: FoodTinMRE
          prob: 0.8

# ================================================
# DIFFICULT TIER CACHE (medium reward)
# ================================================
- type: entity
  parent: CrateGenericSteel
  id: CrateSovietSupplyCacheDifficult
  name: soviet armory cache
  description: A reinforced armory crate from a Soviet forward operating base. Contains military equipment, tickets and rare materials.
  suffix: Difficult
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SalvageTicket50
        - id: SalvageTicket30
        - id: SalvageTicket20
        - id: SheetPlasma
        - id: IngotGold
        - id: ClothingOuterArmorSovietPlate
          prob: 0.5
        - id: DrinkVodkaBottleFull
        - id: MagazinePistolSP
          prob: 0.6
        - id: MagazineLightRifleSP
          prob: 0.4

# ================================================
# IMPOSSIBLE TIER CACHE (large reward)
# ================================================
- type: entity
  parent: CrateGenericSteel
  id: CrateSovietSupplyCacheImpossible
  name: soviet command vault
  description: A heavily secured command-level supply vault recovered from deep Soviet territory. Contains high-value military gear and large quantities of salvage tickets.
  suffix: Impossible
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SalvageTicket100
        - id: SalvageTicket50
        - id: SalvageTicket50
        - id: SheetPlasma
        - id: SheetUranium
        - id: IngotGold
        - id: IngotGold
          prob: 0.5
        - id: ClothingOuterArmorSovietHeavy
          prob: 0.4
        - id: ClothingOuterHardsuitSovietMarine
          prob: 0.15
        - id: WeaponRifleAk
          prob: 0.3
        - id: MagazineBoxLightRifleAP
          prob: 0.5
        - id: DrinkVodkaBottleFull
        - id: ResearchDisk5000
          prob: 0.2

# ================================================
# SFF SUPPLIES (Challenging / Difficult -- lighter faction cache)
# Pre-welded: needs a welder to open. High sell value at cargo.
# ================================================
- type: entity
  parent: CrateBaseWeldable
  id: CrateSFFSupplies
  name: SFF supply crate
  description: A sealed field supply crate marked with SFF insignia. It's been welded shut — whoever packed it didn't want it opened on the front line. Cargo would pay a good price for it.
  suffix: Sealed
  components:
  - type: Icon
    sprite: _Starlight/Structures/Storage/USSP/soviet-crate.rsi
  - type: Sprite
    sprite: _Starlight/Structures/Storage/USSP/soviet-crate.rsi
  - type: Weldable
    isWelded: true
  - type: StaticPrice
    price: 800
  - type: AcidTrapCrate
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SalvageTicket20
        - id: SalvageTicket15
        - id: SheetSteel
        - id: IngotSilver
          prob: 0.6
        - id: SheetPlasma
          prob: 0.3
        - id: DrinkVodkaBottleFull
        - id: FoodTinMRE
          prob: 0.8
        - id: ClothingOuterArmorSovietPlate
          prob: 0.25

