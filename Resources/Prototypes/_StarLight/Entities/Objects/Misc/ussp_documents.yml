# ============================================================
# USSP Classified Documents
# ============================================================

- type: entity
  name: USSP classified document
  description: A classified USSP Naval Command document. The header is stamped in deep red. Whatever this says, someone died to keep it buried.
  parent: Paper
  id: PaperUSSPClassifiedOrders
  suffix: Deployment Orders
  components:
  - type: Paper
    stampState: paper_stamp-centcom
    stampedBy:
    - stampedName: USSP Naval Command
      stampedColor: "#8B0000"
    - stampedName: CLASSIFIED
      stampedColor: "#8B0000"
  - type: TextFilePaperContent
    fileName: ussp_doc_orders.txt

- type: entity
  name: USSP classified document
  description: A USSP Naval Command internal report. The ink is clean but the contents are anything but.
  parent: Paper
  id: PaperUSSPClassifiedReport
  suffix: Field Report
  components:
  - type: Paper
    stampState: paper_stamp-centcom
    stampedBy:
    - stampedName: USSP Naval Command
      stampedColor: "#8B0000"
  - type: TextFilePaperContent
    fileName: ussp_doc_report.txt

- type: entity
  name: USSP classified document
  description: A logistics manifest from a USSP supply operation. Most line items are redacted. What isn't is still concerning.
  parent: Paper
  id: PaperUSSPClassifiedManifest
  suffix: Supply Manifest
  components:
  - type: Paper
    stampState: paper_stamp-centcom
    stampedBy:
    - stampedName: USSP Naval Command
      stampedColor: "#8B0000"
    - stampedName: Stellar Frontier Forces
      stampedColor: "#4B5320"
  - type: TextFilePaperContent
    fileName: ussp_doc_manifest.txt

