- type: entity
  parent: [ BaseSyndicateContraband, WeaponLauncherHydra ]
  id: WeaponLauncherHydraSyndicate
  name: modified hydra
  suffix: Syndicate
  description: It looks like a standard-issue Hydra cleanade launcher, but the safety measures have been filed off.
  components:
  - type: ScanDetectable
  - type: Contraband
    severity: Syndicate
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - Grenade
    proto: GrenadeCleanadeSyndicate

- type: entity
  parent: WeaponLauncherHydraSyndicate
  id: WeaponLauncherHydraEMP
  suffix: EMP
  description: PLOOP... ZAP
  components:
  - type: RevolverAmmoProvider
    proto: GrenadeEMP

# Assault borg rework — integrated grenade launcher, limited-use area-denial platform.
- type: entity
  id: WeaponLauncherChinaLakeBorg
  parent: WeaponLauncherChinaLake
  suffix: Borg Assault
  name: integrated grenade launcher
  description: A China Lake hardmounted to the chassis. Pre-loaded with 3 frag, 3 smoke, and 3 flash rounds — no auto-resupply. Area-denial platform: smoke cuts sightlines, flash breaks rushes, frag punishes clusters. Each round counts. Resupply by picking up compatible grenade rounds in the field.
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    layers:
    - state: mecha_grenadelnchr
      map: ["enum.GunVisualLayers.Base"]
  - type: Wieldable
    freeHandsRequired: 0
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: BallisticAmmoProvider
    capacity: 9
    cycleable: false
    whitelist:
      tags:
        - Grenade
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
  - type: ContainerFill
    containers:
      ballistic-ammo:
      - GrenadeFrag
      - GrenadeFrag
      - GrenadeFrag
      - GrenadeThermobaric
      - GrenadeThermobaric
      - GrenadeThermobaric
      - GrenadeFlash
      - GrenadeFlash
      - GrenadeFlash
  - type: Unremoveable

- type: entity
  parent: WeaponLauncherHydra
  id: WeaponLauncherHydraFilled
  suffix: Filled
  components:
  - type: RevolverAmmoProvider
    proto: GrenadeCleanade