# ============================================================
# Expedition loot bags — worn by tiered comrades and Red Vanguard.
# No Storage (cannot E-open). Use in-hand to scatter loot, then bag deletes itself.
# ============================================================

# Abstract base: equippable in back slot, no Storage, no speed penalty.
- type: entity
  abstract: true
  parent: Clothing
  id: SovietLootBagBase
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Duffels/soviet_marine_duffel.rsi
    state: icon
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: ExplosionResistance
    damageCoefficient: 0.3

- type: entity
  parent: SovietLootBagBase
  id: ClothingBackpackDuffelSovietComradeChallengingLoot
  name: comrade kitbag
  description: A battered Soviet duffel bag. Something rattles inside. Use in-hand to open.
  components:
  - type: SovietLootBag
    loot:
    - MagazinePistolSP
    - MagazinePistolSP
    - BruteAutoInjector
    - BruteAutoInjector
    - ClothingHeadHatUshanka
    - DrinkVodkizineBottleFull
    - Flare
    - Flare

