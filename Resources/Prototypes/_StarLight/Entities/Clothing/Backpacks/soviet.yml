# ========================================================
# EXPEDITION COMRADE LOOT BAGS - tiered by difficulty.
# Dropped on mob death; looted by salvagers.
# Balance: light utility at Challenging, escalating to
# ammo + grenades at Impossible, plus a small bounty
# ticket for Red Vanguard as an elite reward.
# ========================================================

- type: entity
  id: ClothingBackpackDuffelSovietComradeChallengingLoot
  name: SSF duffel bag
  parent: ClothingBackpackDuffelSSF
  description: A battered olive-drab bag. Light supplies and personal effects.
