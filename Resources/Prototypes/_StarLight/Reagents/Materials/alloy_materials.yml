# Starlight: Alloy materials produced by the Alloy Smeltery.
# These are advanced alloys smelted from existing metals.
# Plastitium   = Plasteel + Titanium vibes (steel + plasma + gold traces)
# PlastitiumAlloy = Refined plastitium alloy (harder)
# Synthmetal   = Steel + Silver + Uranium (radiation-resistant meta-alloy)
# Synthalloy   = Ultra-dense Synthmetal + Plasma composite (elite tier)

